name: ubuntu24.04

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/config.toml"
      - ".github/workflows/gen_ubuntu24.04.yml"
      - "assets/fonts/**/*"
      - "assets/icon/*"
      - "assets/open-phiterm-here"
      - "assets/phiterm-nautilus.py"
      - "assets/phiterm.appdata.xml"
      - "assets/phiterm.desktop"
      - "assets/shell-completion/**/*"
      - "assets/shell-integration/**/*"
      - "ci/deploy.sh"
      - "ci/tag-name.sh"
      - "get-deps"
      - "termwiz/data/wezterm.terminfo"

jobs:
  build:
    runs-on: "ubuntu-latest"
    container: "ubuntu:24.04"
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: "set APT to non-interactive"
        shell: bash
        run: "echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections"
      - name: "Update APT"
        shell: bash
        run: "apt update"
      - name: "Install git"
        shell: bash
        run: "apt-get install -y git"
      - name: "Install curl"
        shell: bash
        run: "apt-get install -y curl"
      - name: "Update APT"
        shell: bash
        run: "apt update"
      - name: "Ensure /run/sshd exists"
        shell: bash
        run: "mkdir -p /run/sshd"
      - name: "Install openssh-server"
        shell: bash
        run: "apt-get install -y openssh-server"
      - name: "Workaround git permissions issue"
        shell: bash
        run: "git config --global --add safe.directory /__w/wezterm/wezterm"
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: "Build phiterm (Release mode)"
        shell: bash
        run: "cargo build -p phiterm --release"
      - name: "Build phiterm-gui (Release mode)"
        shell: bash
        run: "cargo build -p phiterm-gui --release"
      - name: "Build phiterm-mux-server (Release mode)"
        shell: bash
        run: "cargo build -p phiterm-mux-server --release"
      - name: "Build strip-ansi-escapes (Release mode)"
        shell: bash
        run: "cargo build -p strip-ansi-escapes --release"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "ubuntu24.04"
      - name: "Test"
        shell: bash
        run: "cargo nextest run --all --no-fail-fast"
      - name: "Test wezterm-escape-parser (no_std)"
        shell: bash
        run: "cargo nextest run -p wezterm-escape-parser"
      - name: "Package"
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "ubuntu24.04"
          path: |
            phiterm-*.deb
            phiterm-*.xz
